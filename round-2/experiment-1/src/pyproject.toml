[project]
name = "routing-experiment"
version = "0.1.0"
description = "Experiment to test if tiny routers improve decoding"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.1",
    "pandas==3.0.5",
    "scikit-learn==1.9.0",
    "scipy==1.18.0",
    "matplotlib==3.11.1",
    "seaborn==0.13.2",
    "sentence-transformers==5.6.1",
    "torch==2.13.0",
    "requests==2.34.2",
    "loguru==0.7.3",
    "tenacity==9.1.4",
    "tqdm==4.70.0",
    "pillow==12.3.0",
    "psutil==7.2.2",
    "pydantic==2.13.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
